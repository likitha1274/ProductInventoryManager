<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Inventory Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Product Inventory Manager</h1>
        <p>Manage your products and stock easily.</p>

        <form id="productForm">
            <input type="text" id="productName" placeholder="Product name" required>
            <input type="number" id="productPrice" placeholder="Price" min="0" step="0.01" required>
            <input type="number" id="productQuantity" placeholder="Quantity" min="0" step="1" required>
            <button type="submit">Add Product</button>
        </form>

        <h2>Inventory</h2>
        <p id="summary">Total products: 0</p>

        <table>
            <thead>
                <tr>
                    <th>Product</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="inventoryList"></tbody>
        </table>

        <p id="message"></p>
    </div>

    <script src="dist/app.js"></script>
</body>
</html>
